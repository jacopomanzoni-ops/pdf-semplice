name: Compila APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o pdf-semplice.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk PDF-Semplice.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: PDF Semplice
          files: PDF-Semplice.apk
